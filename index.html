<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#007aff">
  <link rel="apple-touch-icon" href="icona.png">
  <link rel="manifest" href="manifest.json">
  <title>Le Mie Spese</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCHERMATA 1: DASHBOARD -->
  <div id="dashboardView" class="view">
    <header>
      <h1>Le Mie Spese</h1>
      <!-- Tasto Impostazioni -->
      <button id="btnSettings" class="icon-btn">⚙️</button>
    </header>

    <!-- Limite di spesa in chiaro -->
    <div class="total-container">
      <div class="total-label">Spesa nel periodo</div>
      <div class="total-amount" id="displayTotal">€0.00</div>
      <div id="budgetInfo" class="budget-info">Limite: Non impostato</div>
      <div class="progress-bar-bg"><div id="budgetProgress" class="progress-bar-fill"></div></div>
    </div>
    
    <div class="controls-container">
      <input type="text" id="searchFilter" placeholder="Cerca categoria, città...">
      
      <!-- Nuovo filtro Date: Da - A -->
      <div class="filters-row date-range">
        <div><label>Da:</label><input type="date" id="startDate"></div>
        <div><label>A:</label><input type="date" id="endDate"></div>
      </div>

      <select id="sortSelect" style="margin-top:10px;">
        <option value="dataDesc">Data (più recenti)</option>
        <option value="dataAsc">Data (meno recenti)</option>
        <option value="importoDesc">Importo (più alto)</option>
        <option value="importoAsc">Importo (più basso)</option>
      </select>
    </div>

    <div id="expensesList" class="expenses-list"></div>
    <button id="fabAdd" class="fab">+</button>
  </div>

  <!-- SCHERMATA 2: MODULO -->
  <div id="formView" class="view hidden">
    <header><h1 id="formTitle">Nuova Spesa</h1></header>
    <form id="expenseForm">
      <input type="hidden" id="expenseId">
      <div class="input-group"><label>Data</label><input type="date" id="data" required></div>
      <div class="input-group"><label>Importo (€)</label><input type="number" id="importo" step="0.01" inputmode="decimal" required></div>
      <div class="input-group"><label>Titolo / Categoria</label><input type="text" id="testo" required></div>
      <div class="input-group"><label>Città</label><input type="text" id="citta" required></div>
      <div class="input-group"><label>Descrizione (opzionale)</label><textarea id="descrizione" rows="3"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn-secondary btnCancel">Annulla</button>
        <button type="submit" class="btn-primary">Salva Spesa</button>
      </div>
    </form>
  </div>

  <!-- SCHERMATA 3: IMPOSTAZIONI -->
  <div id="settingsView" class="view hidden">
    <header><h1>Impostazioni</h1></header>
    <div class="settings-content">
      <div class="input-group">
        <label>Limite di Spesa personalizzato (€)</label>
        <input type="number" id="budgetLimitInput" placeholder="Es. 300" step="1" inputmode="decimal">
        <p class="help-text">Verrà confrontato con il totale filtrato nella Dashboard.</p>
        <button id="btnSaveBudget" class="btn-primary" style="padding: 10px; margin-top: 5px;">Salva Limite</button>
      </div>
      <hr>
      <div class="input-group">
        <label>Gestione Dati</label>
        <button id="btnExport" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">⬇️ Esporta CSV</button>
        <label for="csvFileInput" class="btn-secondary" style="display: block; text-align: center; cursor: pointer;">⬆️ Importa CSV</label>
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
      </div>
    </div>
    <div style="padding: 20px;">
      <button type="button" class="btn-secondary btnCancel" style="width: 100%;">Torna alla Home</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

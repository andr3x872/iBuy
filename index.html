<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#007aff">
  <link rel="apple-touch-icon" href="icona.png">
  <link rel="manifest" href="manifest.json">
  
  <title>Le Mie Spese</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Aggiunta stile veloce per il riquadro del totale */
    .total-container {
      background: var(--surface);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .total-label {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .total-amount {
      font-size: 32px;
      font-weight: bold;
      color: var(--primary);
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA 1: DASHBOARD -->
  <div id="dashboardView" class="view">
    <header>
      <h1>Le Mie Spese</h1>
    </header>

    <!-- NUOVO: Riquadro del Totale -->
    <div class="total-container">
      <div class="total-label">Totale Visualizzato</div>
      <div class="total-amount" id="displayTotal">€0.00</div>
    </div>
    
    <div class="controls-container">
      <input type="text" id="searchFilter" placeholder="Cerca categoria, descrizione o città...">
      <div class="filters-row">
        <!-- MODIFICATO: da type="month" a type="date" per filtrare il giorno esatto -->
        <input type="date" id="dateFilter">
        <select id="sortSelect">
          <option value="dataDesc">Data (più recenti)</option>
          <option value="dataAsc">Data (meno recenti)</option>
          <option value="importoDesc">Importo (più alto)</option>
          <option value="importoAsc">Importo (più basso)</option>
        </select>
      </div>
      <button id="btnExport" class="btn-secondary" style="width: 100%; margin-top: 10px; font-size: 14px; padding: 10px;">
        ⬇️ Esporta Spese in CSV (Excel)
      </button>
    </div>

    <div id="expensesList" class="expenses-list">
      <!-- Le spese verranno iniettate qui -->
    </div>

    <button id="fabAdd" class="fab">+</button>
  </div>

  <!-- SCHERMATA 2: MODULO -->
  <div id="formView" class="view hidden">
    <!-- ... (Il modulo rimane identico al passaggio precedente) ... -->
    <header>
      <h1 id="formTitle">Nuova Spesa</h1>
    </header>
    
    <form id="expenseForm">
      <input type="hidden" id="expenseId">
      
      <div class="input-group">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>
      
      <div class="input-group">
        <label for="importo">Importo (€)</label>
        <input type="number" id="importo" step="0.01" inputmode="decimal" required>
      </div>
      
      <div class="input-group">
        <label for="testo">Titolo / Categoria</label>
        <input type="text" id="testo" required>
      </div>

      <div class="input-group">
        <label for="citta">Città</label>
        <input type="text" id="citta" required>
      </div>
      
      <div class="input-group">
        <label for="descrizione">Descrizione (opzionale)</label>
        <textarea id="descrizione" rows="3"></textarea>
      </div>
      
      <div class="form-actions">
        <button type="button" id="btnCancel" class="btn-secondary">Annulla</button>
        <button type="submit" class="btn-primary">Salva Spesa</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato', reg.scope))
          .catch(err => console.error('SW errore', err));
      });
    }
  </script>
</body>
</html>
